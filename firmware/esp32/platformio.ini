[platformio]
include_dir = ../../include

[env:m5stickc-plus]
platform = espressif32 @ 6.12.0
board = m5stick-c
; PLUS 1.1 uses the same ESP32-PICO-D4 target; no TFT library is initialized.
upload_speed = 115200
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
extra_scripts = pre:embed_web.py

[env:tenstar-c3]
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:embed_web.py
    post:c3_rom_upload.py
